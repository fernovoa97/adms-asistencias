{% extends "base.html" %}

{% block titulo %}{{ acta.nombre }} · Actas de entrega{% endblock %}

{% block contenido %}
<a href="{{ url_for('actas.pagina_actas') }}" class="muted" style="text-decoration:none;">← Volver a actas</a>

<h1 style="margin-top:8px;">{{ acta.nombre }}</h1>
{% if acta.descripcion %}<p class="lead">{{ acta.descripcion }}</p>{% endif %}

<div class="panel" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
  <div class="field" style="flex:1;min-width:200px;margin-bottom:0;">
    <label for="nuevoItemNombre">Agregar otro ítem</label>
    <input type="text" id="nuevoItemNombre" placeholder="Ej. Chaleco de seguridad">
  </div>
  <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;margin-bottom:2px;">
    <input type="checkbox" id="nuevoItemDevolucion">
    Requiere devolución
  </label>
  <button type="button" class="btn secondary" id="agregarItemBtn">+ Agregar ítem</button>
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="tabla-contenedor">
  <table>
    <thead id="tablaCabecera">
      <tr><th>Trabajador</th></tr>
    </thead>
    <tbody id="tablaCuerpo">
      <tr><td class="muted" style="text-align:center;padding:24px;">Cargando…</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
  const ACTA_ID = {{ acta.id }};
</script>
<script src="/static/js/acta_detalle.js"></script>
{% endblock %}
