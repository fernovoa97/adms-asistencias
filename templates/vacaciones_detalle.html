<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacaciones de {{ trabajador.nombre }} · Personal y Asistencias</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell">
    {% include '_sidebar.html' %}

    <main class="main">
      <a href="{{ url_for('vacaciones.pagina_vacaciones') }}" class="muted" style="text-decoration:none;">← Volver a vacaciones</a>

      <h1 style="margin-top:8px;">{{ trabajador.nombre }}</h1>
      <p class="lead" id="fechaIngresoTexto"></p>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Acumulado</div>
          <div class="stat-value" id="statAcumulado">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Tomadas</div>
          <div class="stat-value" id="statTomadas">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Saldo</div>
          <div class="stat-value" id="statSaldo">—</div>
        </div>
      </div>

      <div class="panel">
        <h2 style="margin-top:0;font-size:1rem;">Ajuste manual del acumulado</h2>
        <p class="muted" id="calculoAutomaticoTexto">Calculando…</p>
        <div class="error-msg" id="errorAjuste"></div>
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
          <div class="field" style="margin-bottom:0;">
            <label for="ajusteManualInput">Días acumulados (manual, opcional)</label>
            <input type="number" id="ajusteManualInput" step="0.5" placeholder="Dejar vacío = automático">
          </div>
          <button type="button" class="btn secondary" id="guardarAjusteBtn">Guardar ajuste</button>
          <button type="button" class="btn secondary" id="quitarAjusteBtn">Volver a automático</button>
        </div>
      </div>

      <div class="panel">
        <h2 style="margin-top:0;font-size:1rem;">Registrar días tomados</h2>
        <div class="error-msg" id="errorTomada"></div>
        <div class="grid-2">
          <div class="field">
            <label for="fechaTomada">Fecha</label>
            <input type="date" id="fechaTomada">
          </div>
          <div class="field">
            <label for="diasTomada">Cantidad de días</label>
            <input type="number" id="diasTomada" step="0.5" min="0.5" placeholder="Ej. 7">
          </div>
        </div>
        <div class="field">
          <label for="observacionTomada">Nota (opcional)</label>
          <input type="text" id="observacionTomada" placeholder="Ej. Vacaciones de fin de año">
        </div>
        <button type="button" class="btn" id="agregarTomadaBtn">Agregar</button>
      </div>

      <h3 style="font-size:0.95rem;">Historial de días tomados</h3>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Días</th>
              <th>Nota</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tablaTomadas">
            <tr><td colspan="4" class="muted" style="text-align:center;padding:20px;">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const TRABAJADOR_ID = {{ trabajador.id }};
  </script>
  <script src="/static/js/vacaciones_detalle.js"></script>
</body>
</html>
