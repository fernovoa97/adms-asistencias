<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo trabajador · Personal y Asistencias</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell">
    {% include '_sidebar.html' %}

    <main class="main">
      <h1>Nuevo trabajador</h1>
      <p class="lead">Completa los datos y adjunta los documentos en PDF del trabajador.</p>

      <div class="success-msg" id="successMsg"></div>
      <div class="error-msg" id="errorMsg"></div>

      <form id="workerForm">
        <div class="panel">
          <h2 style="margin-top:0;font-size:1rem;">Datos personales</h2>
          <div class="grid-2">
            <div class="field">
              <label for="nombres">Nombres *</label>
              <input type="text" id="nombres" name="nombres" required>
            </div>
            <div class="field">
              <label for="apellidos">Apellidos *</label>
              <input type="text" id="apellidos" name="apellidos" required>
            </div>
            <div class="field">
              <label for="dni">DNI *</label>
              <input type="text" id="dni" name="dni" required>
            </div>
            <div class="field">
              <label for="telefono">Teléfono</label>
              <input type="text" id="telefono" name="telefono">
            </div>
            <div class="field">
              <label for="email">Correo electrónico</label>
              <input type="email" id="email" name="email">
            </div>
            <div class="field">
              <label for="fechaIngreso">Fecha de ingreso</label>
              <input type="date" id="fechaIngreso" name="fechaIngreso">
            </div>
            <div class="field">
              <label for="fechaFinContrato">Fecha de fin de contrato</label>
              <input type="date" id="fechaFinContrato" name="fechaFinContrato">
            </div>
            <div class="field">
              <label for="fechaRenovacion">Fecha de renovación</label>
              <input type="date" id="fechaRenovacion" name="fechaRenovacion">
            </div>
            <div class="field">
              <label for="cargo">Cargo</label>
              <input type="text" id="cargo" name="cargo">
            </div>
            <div class="field">
              <label for="area">Área / Departamento</label>
              <input type="text" id="area" name="area">
            </div>
            <div class="field">
              <label for="supervisor">Supervisor</label>
              <input type="text" id="supervisor" name="supervisor">
            </div>
            <div class="field">
              <label for="sueldoNeto">Sueldo neto (S/)</label>
              <input type="number" id="sueldoNeto" name="sueldoNeto" step="0.01" min="0">
            </div>
          </div>
          <div class="field">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion">
          </div>
          <div class="field">
            <label for="observaciones">Observaciones</label>
            <textarea id="observaciones" name="observaciones" rows="3"></textarea>
          </div>
        </div>

        <div class="panel">
          <h2 style="margin-top:0;font-size:1rem;">Documentos (PDF)</h2>
          <p class="muted">Agrega uno o más archivos PDF. Puedes ponerle un nombre a cada uno (ej. "DNI", "Contrato", "CV").</p>

          <div id="uploadRows"></div>

          <button type="button" class="btn secondary" id="addFileBtn">+ Agregar documento PDF</button>

          <div id="previewArea"></div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Guardar trabajador</button>
      </form>
    </main>
  </div>

  <script src="/static/js/nuevo_trabajador.js"></script>
</body>
</html>
