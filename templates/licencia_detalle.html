<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licencias de {{ trabajador.nombre }} · Personal y Asistencias</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell">
    {% include '_sidebar.html' %}

    <main class="main">
      <a href="{{ url_for('licencias.pagina_licencias') }}" class="muted" style="text-decoration:none;">← Volver a licencias</a>

      <h1 style="margin-top:8px;">{{ trabajador.nombre }}</h1>

      <div class="panel">
        <h2 style="margin-top:0;font-size:1rem;">Registrar una licencia</h2>
        <div class="error-msg" id="errorLicencia"></div>
        <div class="grid-2">
          <div class="field">
            <label for="fechaLicencia">Fecha</label>
            <input type="date" id="fechaLicencia">
          </div>
          <div class="field">
            <label for="motivoLicencia">Motivo (opcional)</label>
            <input type="text" id="motivoLicencia" placeholder="Ej. Cita médica">
          </div>
          <div class="field">
            <label for="horaInicioLicencia">Hora de inicio</label>
            <input type="time" id="horaInicioLicencia">
          </div>
          <div class="field">
            <label for="horaFinLicencia">Hora de fin</label>
            <input type="time" id="horaFinLicencia">
          </div>
        </div>
        <button type="button" class="btn" id="agregarLicenciaBtn">Registrar licencia</button>
      </div>

      <h3 style="font-size:0.95rem;">Historial completo</h3>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>De</th>
              <th>A</th>
              <th>Horas</th>
              <th>Motivo</th>
              <th>Documentos de sustento</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tablaLicenciasDetalle">
            <tr><td colspan="7" class="muted" style="text-align:center;padding:20px;">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
      <div id="pdfPreviewArea"></div>
    </main>
  </div>

  <script>
    const TRABAJADOR_ID = {{ trabajador.id }};
  </script>
  <script src="/static/js/licencia_detalle.js"></script>
</body>
</html>
