<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="{{ url_for('static', filename='img/logo-glow.png') }}" alt="Shareate Drillco">
  </div>
  <nav>
    <details class="nav-group" {% if active_page in ['inicio', 'resumen', 'ajustes', 'historial'] %}open{% endif %}>
      <summary>Asistencias</summary>
      <div class="nav-submenu">
        <a href="{{ url_for('inicio') }}" class="{{ 'active' if active_page == 'inicio' }}">Panel</a>
        <a href="{{ url_for('resumen.pagina_resumen') }}" class="{{ 'active' if active_page == 'resumen' }}">Resumen</a>
        <a href="{{ url_for('ajustes.pagina_ajustes') }}" class="{{ 'active' if active_page == 'ajustes' }}">Ajustes</a>
      </div>
    </details>

    <details class="nav-group" {% if active_page in ['nuevo_trabajador', 'buscar_trabajador', 'boletas', 'actas', 'vacaciones', 'descansos_medicos'] %}open{% endif %}>
      <summary>Colaboradores</summary>
      <div class="nav-submenu">
        <a href="{{ url_for('trabajadores.pagina_nuevo_trabajador') }}" class="{{ 'active' if active_page == 'nuevo_trabajador' }}">Nuevo trabajador</a>
        <a href="{{ url_for('trabajadores.pagina_buscar_trabajador') }}" class="{{ 'active' if active_page == 'buscar_trabajador' }}">Buscar trabajador</a>
        <a href="{{ url_for('boletas.pagina_boletas') }}" class="{{ 'active' if active_page == 'boletas' }}">Boletas de pago</a>
        <a href="{{ url_for('actas.pagina_actas') }}" class="{{ 'active' if active_page == 'actas' }}">Actas de entrega</a>
        <a href="{{ url_for('vacaciones.pagina_vacaciones') }}" class="{{ 'active' if active_page == 'vacaciones' }}">Vacaciones</a>
        <a href="{{ url_for('descansos_medicos.pagina_descansos_medicos') }}" class="{{ 'active' if active_page == 'descansos_medicos' }}">Descansos médicos</a>
      </div>
    </details>

    <a href="{{ url_for('calendario.pagina_calendario') }}" class="nav-toplink {{ 'active' if active_page == 'calendario' }}">Calendario</a>
    <a href="{{ url_for('vehiculos.pagina_vehiculos') }}" class="nav-toplink {{ 'active' if active_page == 'vehiculos' }}">Vehículos</a>
  </nav>
  <div class="user-box">
    {% set username = session.get('username', 'usuario') %}
    <div class="user-box-profile">
      <div class="user-avatar">{{ username[0]|upper }}</div>
      <div class="user-box-text">
        <div class="greeting">Bienvenido</div>
        <div class="username">{{ username }}</div>
      </div>
    </div>
    <a class="btn secondary" href="{{ url_for('auth.logout') }}">Cerrar sesión</a>
  </div>
</aside>
