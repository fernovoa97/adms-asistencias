<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar trabajador · Personal y Asistencias</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell">
    {% include '_sidebar.html' %}

    <main class="main">
      <h1>Buscar trabajador</h1>
      <p class="lead">Todos tus trabajadores. Escribe para filtrar por nombre, apellido, DNI o código de empleado.</p>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar..." autocomplete="off">
      </div>

      <div class="vista-toggle" id="tabsEstado" style="margin-bottom:14px;">
        <a href="#" data-tab="activos" class="active">Activos <span id="contadorActivos"></span></a>
        <a href="#" data-tab="inactivos">Inactivos <span id="contadorInactivos"></span></a>
      </div>

      <div id="resultList" class="result-list"></div>
      <div id="workerDetail"></div>

      <div id="nuevaSedeModalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-box">
          <h2 style="margin-top:0;font-size:1.05rem;">Nueva sede</h2>
          <div class="error-msg" id="nuevaSedeErrorMsg"></div>
          <div class="field">
            <label for="nuevaSedeNombre">Nombre de la sede</label>
            <input type="text" id="nuevaSedeNombre" placeholder="Ej. Lurín">
          </div>
          <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;margin-bottom:16px;">
            <input type="checkbox" id="nuevaSedeAlerta">
            Avisar si un trabajador de esta sede no marca asistencia (sedes remotas)
          </label>
          <div style="display:flex;gap:10px;">
            <button type="button" class="btn secondary" id="nuevaSedeCancelarBtn">Cancelar</button>
            <button type="button" class="btn" id="nuevaSedeGuardarBtn">Guardar sede</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/buscar_trabajador.js"></script>
</body>
</html>
