<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar trabajador · Personal y Asistencias</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell">
    {% include '_sidebar.html' %}

    <main class="main">
      <h1>Buscar trabajador</h1>
      <p class="lead">Todos tus trabajadores. Escribe para filtrar por nombre, apellido, DNI o código de empleado.</p>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar..." autocomplete="off">
      </div>

      <div class="vista-toggle" id="tabsEstado" style="margin-bottom:14px;">
        <a href="#" data-tab="activos" class="active">Activos <span id="contadorActivos"></span></a>
        <a href="#" data-tab="inactivos">Inactivos <span id="contadorInactivos"></span></a>
      </div>

      <div id="resultList" class="result-list"></div>
      <div id="workerDetail"></div>
    </main>
  </div>

  <script src="/static/js/buscar_trabajador.js"></script>
</body>
</html>
