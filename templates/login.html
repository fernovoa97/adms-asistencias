<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Personal y Asistencias</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div>
      <img src="{{ url_for('static', filename='img/logo-glow.png') }}" alt="Shareate Drillco" class="login-logo">
      <div class="login-card">
        <h1>Personal y Asistencias</h1>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        {% if error %}
        <div class="error-msg" style="display:block;">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn block">Ingresar</button>
        </form>

        <p class="default-creds">Usuario por defecto: <strong>admin</strong> · Contraseña: <strong>admin123</strong></p>
      </div>
    </div>
  </div>
</body>
</html>
