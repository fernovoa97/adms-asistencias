<div id="contratoModalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal-box modal-ancho">
    <h2 id="contratoModalTitulo">Nuevo contrato</h2>
    <div class="error-msg" id="contratoFormError"></div>
    <div class="grid-2">
      <div class="field">
        <label for="cfCategoria">Categoría *</label>
        <select id="cfCategoria"></select>
      </div>
      <div class="field" id="cfTrabajadorCampo" hidden>
        <label for="cfTrabajador">Colaborador</label>
        <select id="cfTrabajador"></select>
      </div>
      <div class="field">
        <label for="cfContraparte">Empresa / contraparte *</label>
        <input type="text" id="cfContraparte">
      </div>
      <div class="field">
        <label for="cfRuc">RUC</label>
        <input type="text" id="cfRuc" inputmode="numeric" maxlength="11">
      </div>
    </div>
    <div class="field">
      <label for="cfObjeto">Objeto del contrato *</label>
      <textarea id="cfObjeto" rows="2"></textarea>
    </div>
    <div class="grid-2">
      <div class="field">
        <label for="cfSuscripcion">Fecha de suscripción</label>
        <input type="date" id="cfSuscripcion">
      </div>
      <div class="field">
        <label for="cfResponsable">Responsable interno *</label>
        <input type="text" id="cfResponsable">
      </div>
      <div class="field">
        <label for="cfInicio">Inicio de vigencia *</label>
        <input type="date" id="cfInicio">
      </div>
      <div class="field">
        <label for="cfFin">Fin de vigencia</label>
        <input type="date" id="cfFin">
      </div>
      <div class="field">
        <label for="cfImporte">Importe</label>
        <input type="number" id="cfImporte" min="0" step="0.01">
      </div>
      <div class="field">
        <label for="cfMoneda">Moneda</label>
        <select id="cfMoneda">
          <option value="PEN">Soles (S/)</option>
          <option value="USD">Dólares (US$)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="cfPdf" id="cfPdfEtiqueta">Contrato firmado (PDF)</label>
      <input type="file" id="cfPdf" accept="application/pdf">
    </div>
    <div class="modal-acciones">
      <button type="button" class="btn secondary" id="contratoCancelarBtn">Cancelar</button>
      <button type="button" class="btn" id="contratoGuardarBtn">Guardar contrato</button>
    </div>
  </div>
</div>
